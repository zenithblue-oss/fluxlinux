  - versionName: 2.0.0
    versionCode: 12
    commit: v2.0.0
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y binutils bison patch gcc libc6-dev python3 xz-utils zstd
        bzip2
    gradle:
      - ivarna
    prebuild: python3 ../scripts/assemble_bootstrap.py --package-name com.ivarna.fluxlinux
      --list ../native/package-lists/termux-lib-ssot.txt --mode full
    scanignore:
      - native/bootstrap/
      - app/src/ivarna/assets/pulse-runtime/
      - app/src/zenithblue/assets/pulse-runtime/
      - app/src/main/assets/scripts/opensuse/common/libevp_md2.so
      - app/src/main/assets/scripts/common/setup/bwrap-proot-shim
      - app/src/main/assets/loader.bin
      - assets/xfce4/
      - assets/wallpaper/

  - versionName: 2.0.1
    versionCode: 13
    commit: v2.0.1
    subdir: app
    submodules: true
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y --no-install-recommends openjdk-17-jdk-headless pandoc gtk-doc-tools
        clang lld autoconf-archive gobject-introspection bash-static libssl-dev zlib1g-dev
        libffi-dev libbz2-dev liblzma-dev libsqlite3-dev libreadline-dev autoconf autogen
        automake autopoint
        bison bzip2 curl ed file flex fuse-overlayfs g++ gawk gettext git gperf groff help2man
        intltool jq libglib2.0-dev libltdl-dev libtool-bin lzip m4 make patch pkg-config python-is-python3
        python3 python3-setuptools rsync tcl texinfo unzip xutils-dev xz-utils zip zstd
        gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - mkdir -p /data/data/com.ivarna.fluxlinux/files/usr
      - chown -R vagrant:vagrant /data
    gradle:
      - ivarna
    scanignore:
      - assets/xfce4/
      - assets/wallpaper/
    scandelete:
      - native/bootstrap/
      - app/src/ivarna/assets/pulse-runtime/
      - app/src/zenithblue/assets/pulse-runtime/
      - app/src/main/assets/scripts/common/setup/bwrap-proot-shim
      - app/src/main/assets/scripts/opensuse/common/libevp_md2.so
    build:
      - cd .. && rm -rf native/output/com.ivarna.fluxlinux native/bootstrap/com.ivarna.fluxlinux
      - NDK=$$NDK$$ NO_DOCKER=1 ./scripts/build_packages_for_appid.sh com.ivarna.fluxlinux
        --list termux-lib-ssot
      - ./scripts/build_loader_apk.sh
      - ./scripts/build_guest_helpers.sh
      - python3 scripts/assemble_bootstrap.py --package-name com.ivarna.fluxlinux
        --list native/package-lists/termux-lib-ssot.txt --mode full
    ndk: r29

